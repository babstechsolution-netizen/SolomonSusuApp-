<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
<meta name="theme-color" content="#1A5C2E">
<title>Awinbire Enterprise</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --g-900:#0A2E15;--g-800:#0F3D1C;--g-700:#155228;--g-600:#1A5C2E;--g-500:#216B36;--g-400:#2E7D44;--g-300:#3A9455;--g-100:#A8D8B5;--g-50:#E0F2E7;--g-25:#F0F9F3;
  --a-700:#9B6200;--a-600:#C47D00;--a-500:#F5A623;--a-400:#F7B845;--a-300:#FACC6A;--a-50:#FFFBF0;
  --dep:#16A34A;--dep-bg:#DCFCE7;--dep-txt:#14532D;--wit:#DC2626;--wit-bg:#FEE2E2;--wit-txt:#7F1D1D;--pend:#D97706;--pend-bg:#FEF3C7;--pend-txt:#78350F;--info:#2563EB;--info-bg:#DBEAFE;
  --bg:#F3F5F8;--surf:#FFFFFF;--surf2:#F7F8FB;--surf3:#EEF0F5;--border:#E2E5EE;--border-l:#F0F2F7;
  --t1:#0F1117;--t2:#4B5563;--t3:#9CA3AF;--t4:#D1D5DB;
  --r10:10px;--r12:12px;--r14:14px;--r16:16px;--r18:18px;--r20:20px;--r99:9999px;
  --sh-xs:0 1px 3px rgba(0,0,0,.06);--sh-sm:0 2px 8px rgba(0,0,0,.08);--sh-md:0 4px 16px rgba(0,0,0,.10);--sh-lg:0 8px 32px rgba(0,0,0,.13);--sh-g:0 4px 18px rgba(26,92,46,.28);--sh-a:0 4px 18px rgba(245,166,35,.32);
  --accent:#1A5C2E;
  --ff:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
[data-theme=dark]{
  --bg:#0B0E14;--surf:#161A22;--surf2:#1E2330;--surf3:#252B38;--border:#2A3040;--border-l:#1E2330;
  --t1:#F0F3F9;--t2:#8B95A8;--t3:#525C6E;--t4:#333D50;
  --g-25:#12241a;--g-50:#14311f;--dep-bg:#122a1c;--wit-bg:#2a1416;--pend-bg:#2a2210;--info-bg:#12203a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ff);background:var(--bg);color:var(--t1);line-height:1.5;-webkit-font-smoothing:antialiased;max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
button{font-family:var(--ff);cursor:pointer;border:none;outline:none;}
input,select{font-family:var(--ff);outline:none;}
a{color:inherit;text-decoration:none;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 22px;min-height:52px;border-radius:var(--r99);font-size:14px;font-weight:700;transition:all .15s ease;border:2px solid transparent;white-space:nowrap;}
.btn-p{background:var(--g-600);color:#fff;box-shadow:var(--sh-g);}
.btn-p:active{background:var(--g-700);transform:scale(.98);}
.btn-a{background:var(--a-500);color:#fff;box-shadow:var(--sh-a);}
.btn-ghost{background:var(--g-25);color:var(--g-600);}
.btn-outline{background:transparent;color:var(--g-600);border-color:var(--g-600);}
.btn-danger{background:var(--wit-bg);color:var(--wit);}
.btn-sm{min-height:42px;padding:0 16px;font-size:13px;}
.btn-lg{min-height:60px;padding:0 32px;font-size:16px;}
.btn-full{width:100%;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r99);font-size:11px;font-weight:700;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;}
.b-active,.b-approved{background:var(--dep-bg);color:var(--dep-txt);}.b-active::before,.b-approved::before{background:var(--dep);}
.b-inactive{background:var(--surf3);color:var(--t2);}.b-inactive::before{background:var(--t3);}
.b-def,.b-rejected{background:var(--wit-bg);color:var(--wit-txt);}.b-def::before,.b-rejected::before{background:var(--wit);}
.b-pending{background:var(--pend-bg);color:var(--pend-txt);}.b-pending::before{background:var(--pend);}
.inp-wrap{margin-bottom:14px;}
.inp-lbl{display:block;font-size:12px;font-weight:700;color:var(--t2);margin-bottom:5px;}
.inp{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--r14);font-size:14px;color:var(--t1);background:var(--surf);}
.inp:focus{border-color:var(--g-600);box-shadow:0 0 0 4px rgba(26,92,46,.08);}
.sc{padding-bottom:92px;min-height:100vh;}
.err{background:var(--wit-bg);color:var(--wit-txt);padding:10px 14px;border-radius:var(--r12);font-size:12px;font-weight:600;margin-bottom:14px;}
.card{background:var(--surf);border-radius:var(--r18);padding:18px;box-shadow:var(--sh-xs);margin-bottom:14px;}
.login-hero{background:linear-gradient(160deg,var(--g-900),var(--g-700) 55%,var(--g-400));padding:64px 28px 52px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.login-logo{width:88px;height:88px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--g-700);box-shadow:var(--sh-lg);border:3px solid var(--a-500);margin-bottom:20px;}
.login-app{font-size:20px;font-weight:900;color:#fff;}
.login-tag{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px;}
.login-body{padding:28px 24px 32px;background:var(--surf);}
.login-h{font-size:22px;font-weight:900;margin-bottom:6px;}
.login-sh{font-size:13px;color:var(--t2);margin-bottom:24px;}
.hdr{background:linear-gradient(160deg,var(--g-900),var(--g-700) 60%,var(--g-400));padding:16px 20px 24px;color:#fff;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;}
.hdr-greet{font-size:13px;color:rgba(255,255,255,.65);}
.hdr-name{font-size:20px;font-weight:900;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;}
.hdr-av{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--a-500),var(--a-300));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.3);position:relative;flex-shrink:0;}
.notif-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;background:var(--wit);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;border:2px solid var(--g-700);}
.hero-card{background:rgba(255,255,255,.14);border-radius:var(--r20);padding:18px 20px;border:1px solid rgba(255,255,255,.2);}
.hc-label{font-size:12px;color:rgba(255,255,255,.6);}
.hc-amount{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1.1;}
.hc-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px;}
.pills{display:flex;gap:10px;margin-top:14px;}
.pill{flex:1;background:rgba(255,255,255,.12);border-radius:var(--r12);padding:10px 12px;text-align:center;}
.pill-val{font-size:18px;font-weight:800;line-height:1;}
.pill-lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:3px;}
.kpi-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
.kpi-row::-webkit-scrollbar{display:none;}
.kpi{min-width:150px;flex-shrink:0;background:rgba(255,255,255,.13);border-radius:var(--r16);padding:14px;border:1px solid rgba(255,255,255,.15);}
.kpi-ic{font-size:18px;margin-bottom:6px;}
.kpi-val{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.kpi-lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:4px;}
.body-pad{padding:16px;}
.s-div{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;margin-top:4px;}
.s-div-title{font-size:14px;font-weight:800;}
.s-div-link{font-size:12px;font-weight:700;color:var(--g-600);}
.prog-bg{height:10px;background:var(--surf3);border-radius:var(--r99);overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g-700),var(--g-300));border-radius:var(--r99);}
.gold .prog-fill{background:linear-gradient(90deg,var(--a-600),var(--a-400));}
.qa-row{display:flex;gap:12px;margin-bottom:16px;}
.qa-btn{flex:1;border-radius:var(--r18);padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.qa-btn:active{transform:scale(.97);}
.qa-collect{background:linear-gradient(135deg,var(--g-700),var(--g-400));box-shadow:var(--sh-g);color:#fff;}
.qa-withdraw{background:var(--surf);box-shadow:var(--sh-sm);border:2px solid var(--border);color:var(--g-600);}
.qa-scan{background:linear-gradient(135deg,var(--a-700),var(--a-500));box-shadow:var(--sh-a);color:#fff;}
.qa-icon{font-size:26px;}.qa-lbl{font-size:13px;font-weight:800;}
.cli{background:var(--surf);border-radius:var(--r16);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--sh-xs);}
.cli-av{width:46px;height:46px;border-radius:var(--r14);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
.cli-info{flex:1;min-width:0;}
.cli-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cli-meta{font-size:11px;color:var(--t3);margin-top:1px;}
.cli-right{text-align:right;flex-shrink:0;}
.cli-bal{font-size:15px;font-weight:900;color:var(--dep);}
.cli-id{font-size:10px;color:var(--t4);margin-top:2px;}
.app-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--g-700);color:#fff;}
.ab-back{width:40px;height:40px;border-radius:var(--r12);display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.15);flex-shrink:0;}
.ab-title{flex:1;font-size:17px;font-weight:800;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:var(--r14);padding:12px 16px;box-shadow:var(--sh-xs);margin-bottom:14px;border:2px solid var(--border-l);}
.search-bar input{border:none;flex:1;font-size:14px;background:transparent;color:var(--t1);}
.chip-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{padding:8px 16px;border-radius:var(--r99);font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;background:var(--surf);color:var(--t2);border:1.5px solid var(--border);}
.chip.on{background:var(--g-600);color:#fff;border-color:var(--g-600);}
.step-ind{padding:12px 20px 0;display:flex;gap:6px;align-items:center;}
.step-ind div.b{height:4px;flex:1;background:var(--border);border-radius:99px;}
.step-ind div.b.on{background:var(--g-600);}
.cust-confirm{background:var(--surf);border-radius:var(--r18);padding:16px;display:flex;align-items:center;gap:14px;margin:16px;box-shadow:var(--sh-sm);border:2px solid var(--dep);}
.cust-confirm.wit{border-color:var(--wit);}
.cc-av{width:52px;height:52px;border-radius:var(--r14);background:linear-gradient(135deg,var(--a-600),var(--a-400));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0;}
.cc-name{font-size:16px;font-weight:800;}
.cc-id{font-size:11px;color:var(--t3);margin-top:2px;}
.cc-bal{font-size:13px;color:var(--dep);font-weight:700;margin-top:4px;}
.type-toggle{display:flex;gap:8px;margin:0 16px;}
.type-btn{flex:1;border:2px solid var(--border);border-radius:var(--r14);padding:12px;text-align:center;font-weight:800;font-size:14px;color:var(--t2);background:var(--surf);}
.type-btn.sel-dep{border-color:var(--g-600);background:var(--g-25);color:var(--g-600);}
.type-btn.sel-wit{border-color:var(--wit);background:var(--wit-bg);color:var(--wit);}
.amt-display{text-align:center;padding:24px 20px 14px;}
.amt-curr{font-size:22px;font-weight:700;color:var(--t3);vertical-align:super;}
.amt-val{font-size:52px;font-weight:900;letter-spacing:-3px;color:var(--g-600);}
.amt-val.wit{color:var(--wit);}
.amt-chips{display:flex;gap:8px;justify-content:center;padding:0 16px;flex-wrap:wrap;}
.ac{padding:10px 18px;border-radius:var(--r12);font-size:14px;font-weight:800;background:var(--g-25);color:var(--g-600);border:2px solid var(--g-50);}
.ac.sel{background:var(--g-600);color:#fff;border-color:var(--g-600);}
.sec-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 8px;}
.method-row{display:flex;gap:8px;padding:0 16px;}
.meth-btn{flex:1;border:2px solid var(--border);border-radius:var(--r14);padding:12px 8px;text-align:center;background:var(--surf);}
.meth-btn.sel{border-color:var(--g-600);background:var(--g-25);}
.meth-ico{font-size:22px;display:block;margin-bottom:5px;}
.meth-lbl{font-size:11px;font-weight:700;color:var(--t2);}
.meth-btn.sel .meth-lbl{color:var(--g-600);}
.fee-box{margin:16px;background:var(--pend-bg);border-radius:var(--r14);padding:14px 16px;font-size:12px;color:var(--pend-txt);}
.fee-row{display:flex;justify-content:space-between;margin-bottom:4px;}
.confirm-card{background:var(--surf);border-radius:var(--r20);margin:16px;box-shadow:var(--sh-sm);overflow:hidden;}
.confirm-top{background:linear-gradient(135deg,var(--g-700),var(--g-400));padding:24px 20px;text-align:center;color:#fff;}
.confirm-top.wit{background:linear-gradient(135deg,#B91C1C,var(--wit));}
.conf-type{font-size:12px;color:rgba(255,255,255,.7);text-transform:uppercase;}
.conf-amt{font-size:44px;font-weight:900;letter-spacing:-2px;margin:8px 0 4px;}
.conf-fee{font-size:12px;color:rgba(255,255,255,.65);}
.confirm-body,.rcpt-body{padding:20px;}
.conf-row,.rcpt-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-l);}
.conf-row:last-child,.rcpt-row:last-child{border-bottom:none;}
.conf-key,.rcpt-key{font-size:13px;color:var(--t2);}.conf-val,.rcpt-val{font-size:13px;font-weight:700;}
.receipt-success{background:linear-gradient(160deg,var(--g-900),var(--g-700));padding:28px 24px 36px;text-align:center;color:#fff;}
.receipt-success.wit{background:linear-gradient(160deg,#7F1D1D,var(--wit));}
.rcpt-check{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;}
.rcpt-title{font-size:20px;font-weight:900;}
.rcpt-sub{font-size:13px;color:rgba(255,255,255,.65);margin-top:4px;}
.rcpt-amt{font-size:44px;font-weight:900;letter-spacing:-2px;margin-top:16px;}
.receipt-paper{background:var(--surf);margin:16px;border-radius:var(--r20);box-shadow:var(--sh-md);overflow:hidden;}
.rcpt-stripe{background:repeating-linear-gradient(90deg,var(--g-600) 0,var(--g-600) 8px,var(--a-500) 8px,var(--a-500) 16px);height:6px;}
.rcpt-head{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--border);}
.rcpt-logo-name{font-size:12px;font-weight:800;color:var(--g-600);}
.rcpt-ref{font-size:11px;color:var(--t3);}
.rcpt-ref strong{color:var(--g-600);font-family:monospace;}
.rcpt-actions{display:flex;gap:8px;padding:0 16px 16px;}
/* txn row */
.txn{background:var(--surf);border-radius:var(--r14);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--sh-xs);}
.txn-ic{width:40px;height:40px;border-radius:var(--r12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.txn-ic.dep{background:var(--dep-bg);}.txn-ic.wit{background:var(--wit-bg);}
.txn-mid{flex:1;min-width:0;}
.txn-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-meta{font-size:11px;color:var(--t3);}
.txn-right{text-align:right;flex-shrink:0;}
.txn-amt{font-size:14px;font-weight:900;}
.txn-amt.dep{color:var(--dep);}.txn-amt.wit{color:var(--wit);}
.txn-time{font-size:10px;color:var(--t4);}
/* approval */
.appr{background:var(--surf);border-radius:var(--r18);padding:18px;margin-bottom:12px;box-shadow:var(--sh-xs);border:1.5px solid var(--pend-bg);}
.appr-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.appr-cust{font-size:15px;font-weight:800;}
.appr-meta{font-size:11px;color:var(--t3);margin-top:2px;}
.appr-amt{font-size:22px;font-weight:900;color:var(--wit);}
.appr-body{background:var(--surf2);border-radius:var(--r12);padding:12px 14px;margin-bottom:14px;font-size:12px;}
.appr-body .r{display:flex;justify-content:space-between;margin-bottom:5px;}
.appr-body .r:last-child{margin-bottom:0;}
.appr-acts{display:flex;gap:8px;}
/* notifications */
.nrow{background:var(--surf);border-radius:var(--r16);padding:14px 16px;display:flex;gap:12px;margin-bottom:6px;box-shadow:var(--sh-xs);}
.nrow.unread{border-left:3px solid var(--g-600);}
.n-ic{width:42px;height:42px;border-radius:var(--r12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surf3);}
.n-title{font-size:13px;font-weight:700;}
.n-body{font-size:12px;color:var(--t2);margin-top:2px;}
.n-time{font-size:10px;color:var(--t3);margin-top:5px;}
/* settings */
.set-hero{background:linear-gradient(135deg,var(--g-700),var(--g-400));padding:24px 20px;display:flex;align-items:center;gap:16px;color:#fff;}
.set-av{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,var(--a-600),var(--a-400));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border:3px solid rgba(255,255,255,.3);flex-shrink:0;}
.set-name{font-size:18px;font-weight:900;}
.set-role{display:inline-block;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:var(--r99);font-size:11px;font-weight:700;margin-top:4px;}
.set-sec-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:0 4px;margin:16px 0 6px;}
.set-item{background:var(--surf);padding:15px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border-l);}
.set-item:first-child{border-radius:var(--r14) var(--r14) 0 0;}
.set-item:last-child{border-radius:0 0 var(--r14) var(--r14);border-bottom:none;}
.set-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surf3);}
.set-lbl{flex:1;font-size:14px;font-weight:600;}
.set-val{font-size:12px;color:var(--t3);}
.tgl{width:50px;height:28px;background:var(--border);border-radius:var(--r99);position:relative;transition:background .2s;flex-shrink:0;}
.tgl.on{background:var(--g-600);}
.tgl b{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.15);}
.tgl.on b{transform:translateX(22px);}
.colors{display:flex;gap:8px;}
.cdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
/* bnav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:72px;background:var(--surf);border-top:1px solid var(--border-l);display:flex;align-items:center;justify-content:space-around;padding:0 4px 8px;z-index:50;}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;min-width:52px;position:relative;}
.bnav-icon{font-size:22px;color:var(--t3);}
.bnav-lbl{font-size:10px;font-weight:600;color:var(--t3);}
.bnav-item.act .bnav-icon,.bnav-item.act .bnav-lbl{color:var(--g-600);font-weight:800;}
.bnav-dot{position:absolute;top:2px;right:8px;min-width:16px;height:16px;padding:0 3px;background:var(--wit);border-radius:8px;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.empty{text-align:center;padding:52px 24px;color:var(--t3);}
.empty .ei{font-size:52px;opacity:.35;margin-bottom:14px;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:492px;background:#1A1D25;color:#fff;padding:14px 16px;border-radius:var(--r14);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:300;}
.toast.err{border-left:3px solid var(--wit);}.toast.ok{border-left:3px solid var(--dep);}.toast.warn{border-left:3px solid var(--pend);}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg);}}
.center-load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--t3);font-size:13px;}
.center-load .spin{border-color:rgba(26,92,46,.2);border-top-color:var(--g-600);}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px;}
.bar-grp{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%;}
.bar{flex:1;border-radius:4px 4px 0 0;min-height:2px;}
.bar.d{background:linear-gradient(180deg,var(--g-400),var(--g-700));}
.bar.w{background:linear-gradient(180deg,#F87171,var(--wit));}
.bar-lbls{display:flex;gap:6px;margin-top:6px;}
.bar-lbls span{flex:1;text-align:center;font-size:9px;color:var(--t3);}
.legend{display:flex;gap:16px;margin-top:12px;}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surf);width:100%;max-width:520px;border-radius:var(--r20) var(--r20) 0 0;padding:22px 20px 30px;}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"><div class="center-load"><div class="spin"></div>Loading…</div></div>
<div id="toast-host"></div>
<div id="modal-host"></div>
<script>
(function(){
  "use strict";
  var AV=['#1A5C2E','#C47D00','#1D4ED8','#B91C1C','#6D28D9','#0369A1','#0891b2','#7c2d12'];
  var S={token:localStorage.getItem('aw_token')||null,user:null,screen:'',customers:[],summary:null,dash:null,ws:{feePercent:0,minBalance:0},draft:null,notifs:[],unread:0,txnType:'deposit'};

  function money(n){n=Number(n||0);return 'GH₵'+n.toLocaleString(undefined,{maximumFractionDigits:2});}
  function initials(n){return (n||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();}
  function colorFor(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++){h=s.charCodeAt(i)+((h<<5)-h);}return AV[Math.abs(h)%AV.length];}
  function acctNo(c){return c.qrCode||('AW-'+String(c._id||c.id||'').slice(-6).toUpperCase());}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function uuid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'q-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
  function timeAgo(d){if(!d)return '';var t=new Date(d).getTime();var s=Math.floor((Date.now()-t)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

  function api(path,opts){opts=opts||{};var h=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(S.token)h['Authorization']='Bearer '+S.token;
    return fetch(path,Object.assign({},opts,{headers:h})).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||'Request failed');return j;});});}
  function toast(m,k){var h=document.getElementById('toast-host');h.innerHTML='<div class="toast '+(k||'ok')+'">'+(k==='err'?'⚠️':k==='warn'?'📡':'✅')+'<span>'+esc(m)+'</span></div>';setTimeout(function(){h.innerHTML='';},3200);}
  function modal(html){document.getElementById('modal-host').innerHTML='<div class="modal-bg" id="mbg"><div class="modal">'+html+'</div></div>';document.getElementById('mbg').onclick=function(e){if(e.target.id==='mbg')closeModal();};}
  function closeModal(){document.getElementById('modal-host').innerHTML='';}
  var app=document.getElementById('app');
  function set(h){app.innerHTML=h;}

  function applyTheme(){var p=(S.user&&S.user.preferences)||{};document.documentElement.setAttribute('data-theme',p.darkMode?'dark':'light');}

  // ---------- LOGIN ----------
  function renderLogin(err){S.screen='login';
    set('<div class="login-hero"><div class="login-logo">AE</div><div class="login-app">Awinbire Enterprise</div><div class="login-tag">Savings Management System</div></div>'+
      '<div class="login-body"><div class="login-h">Welcome back 👋</div><div class="login-sh">Sign in to your account</div>'+
      (err?'<div class="err">⚠️ '+esc(err)+'</div>':'')+
      '<div class="inp-wrap"><label class="inp-lbl">Username</label><input class="inp" id="u" autocomplete="username" placeholder="your username"></div>'+
      '<div class="inp-wrap"><label class="inp-lbl">Password</label><input class="inp" id="p" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
      '<button class="btn btn-p btn-full btn-lg" id="go">Sign In &nbsp;→</button>'+
      '<div style="text-align:center;margin-top:18px;font-size:12px;color:var(--t3)">🔒 Connected to your live database</div></div>');
    var go=document.getElementById('go');
    function submit(){var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p){renderLogin('Enter username and password.');return;}
      go.innerHTML='<span class="spin"></span>';go.disabled=true;
      api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})}).then(function(d){S.token=d.token;localStorage.setItem('aw_token',d.token);S.user=d.user;afterLogin();}).catch(function(e){renderLogin(e.message||'Login failed');});}
    go.onclick=submit;document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});}

  function afterLogin(){applyTheme();
    Promise.all([api('/api/transactions/withdrawal-settings').catch(function(){return{data:S.ws};}),loadNotifs()]).then(function(r){S.ws=r[0].data||S.ws;home();}).catch(home);}
  function loadNotifs(){return api('/api/notifications?limit=50').then(function(d){S.notifs=d.data||[];S.unread=d.unread||0;return d;}).catch(function(){return{};});}

  function role(){return S.user&&S.user.role;}
  function home(){var r=role();
    if(r==='Field Collector')collectorHome();
    else if(r==='Customer')customerHome();
    else adminDash();}

  // ---------- COLLECTOR ----------
  function collectorHome(){S.screen='home';set('<div class="center-load"><div class="spin"></div>Loading…</div>');
    Promise.all([api('/api/transactions/collector-summary').catch(function(){return{data:null};}),api('/api/customers').catch(function(){return{data:[]};})]).then(function(r){
      S.summary=r[0].data||{collected:0,visited:0,remaining:0,totalAssigned:0,dailyTarget:0,progress:0};
      var myId=String(S.user.employeeId||'');
      S.customers=(r[1].data||[]).filter(function(c){var ae=c.assignedEmployee&&(c.assignedEmployee._id||c.assignedEmployee);return String(ae||'')===myId;});
      drawCollectorHome();}).catch(function(e){toast(e.message,'err');drawCollectorHome();});}
  function drawCollectorHome(){S.screen='home';var sm=S.summary||{};
    set('<div class="hdr"><div class="hdr-top"><div><div class="hdr-greet">Welcome,</div><div class="hdr-name">'+esc(S.user.name)+'</div><div class="hdr-sub">📍 '+esc(S.user.zone||'Field Collector')+'</div></div>'+avatarNotif()+'</div>'+
      '<div class="hero-card"><div class="hc-label">TODAY\'S COLLECTIONS</div><div class="hc-amount">'+money(sm.collected)+'</div>'+
      '<div class="hc-sub">'+(sm.dailyTarget>0?('Target: '+money(sm.dailyTarget)+' · '+sm.progress+'%'):'Keep collecting today')+'</div>'+
      '<div class="pills"><div class="pill"><div class="pill-val">'+(sm.visited||0)+'</div><div class="pill-lbl">Visited</div></div><div class="pill"><div class="pill-val">'+(sm.remaining||0)+'</div><div class="pill-lbl">Remaining</div></div><div class="pill"><div class="pill-val">'+(sm.totalAssigned||0)+'</div><div class="pill-lbl">Total</div></div></div></div></div>'+
      '<div class="sc"><div class="body-pad">'+
      (sm.dailyTarget>0?('<div class="card"><div class="s-div" style="margin:0 0 10px"><span class="s-div-title">Daily Target</span><span class="s-div-link">'+sm.progress+'%</span></div><div class="prog-bg"><div class="prog-fill" style="width:'+Math.min(100,sm.progress)+'%"></div></div></div>'):'')+
      '<div class="qa-row"><div class="qa-btn qa-collect" data-go="dep"><span class="qa-icon">💰</span><span class="qa-lbl">Collect</span></div><div class="qa-btn qa-withdraw" data-go="wit"><span class="qa-icon">🏧</span><span class="qa-lbl">Withdraw</span></div><div class="qa-btn qa-scan" data-go="find"><span class="qa-icon">🔎</span><span class="qa-lbl">Find</span></div></div>'+
      '<div class="s-div"><span class="s-div-title">My Customers</span><span style="font-size:12px;color:var(--t3)">'+S.customers.length+' total</span></div>'+
      (S.customers.length?S.customers.slice(0,25).map(custRow).join(''):'<div class="empty"><div class="ei">👥</div>No customers assigned yet.</div>')+
      '</div></div>'+bnav('home'));
    q('[data-go="dep"]').onclick=function(){custList('deposit');};q('[data-go="wit"]').onclick=function(){custList('withdrawal');};q('[data-go="find"]').onclick=function(){custList('deposit');};
    wireNav();wireCust();wireAvatar();}
  function custRow(c){return '<div class="cli" data-c="'+esc(c._id)+'"><div class="cli-av" style="background:'+colorFor(c._id)+'">'+initials(c.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(c.name)+'</div><div class="cli-meta">'+esc(c.business||c.location||'—')+(c.dailyAmount?(' · '+money(c.dailyAmount)+'/day'):'')+'</div></div><div class="cli-right"><div class="cli-bal">'+money(c.balance)+'</div><div class="cli-id">'+esc(acctNo(c))+'</div></div></div>';}
  function wireCust(){all('[data-c]').forEach(function(el){el.onclick=function(){var c=S.customers.filter(function(x){return x._id===el.getAttribute('data-c');})[0];if(c)startTxn(c,S.txnType||'deposit');};});}

  function custList(type){S.screen='customers';S.txnType=type||'deposit';
    set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">'+(S.txnType==='withdrawal'?'Withdraw — pick customer':'Collect — pick customer')+'</div></div>'+
      '<div class="sc"><div class="body-pad"><div class="search-bar">🔎<input id="q" placeholder="Search name, business, ID…"></div><div id="list">'+(S.customers.length?S.customers.map(custRow).join(''):'<div class="empty"><div class="ei">👥</div>No customers assigned.</div>')+'</div></div></div>'+bnav('customers'));
    q('[data-back]').onclick=collectorHome;
    var box=q('#q');box.oninput=function(){var v=box.value.toLowerCase();var l=S.customers.filter(function(c){return (c.name||'').toLowerCase().indexOf(v)>=0||(c.business||'').toLowerCase().indexOf(v)>=0||acctNo(c).toLowerCase().indexOf(v)>=0;});q('#list').innerHTML=l.length?l.map(custRow).join(''):'<div class="empty"><div class="ei">🔍</div>No matches.</div>';wireCust();};
    wireNav();wireCust();}

  function startTxn(c,type){S.draft={cust:c,type:type||'deposit',amount:0,method:'Cash',note:''};amountScreen();}
  function amountScreen(){S.screen='amount';var d=S.draft,c=d.cust,isW=d.type==='withdrawal';var chips=isW?[50,100,200,500]:[5,10,20,50,100];
    set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">'+(isW?'Record Withdrawal':'Record Deposit')+'</div></div>'+
      '<div class="step-ind"><div class="b on"></div><div class="b"></div><div style="font-size:11px;color:var(--t3);font-weight:700;margin-left:4px">1 of 2</div></div>'+
      '<div class="cust-confirm'+(isW?' wit':'')+'"><div class="cc-av">'+initials(c.name)+'</div><div style="flex:1"><div class="cc-name">'+esc(c.name)+'</div><div class="cc-id">'+esc(acctNo(c))+'</div><div class="cc-bal" style="'+(isW?'color:var(--wit)':'')+'">Balance: '+money(c.balance)+'</div></div>'+(isW?'✏️':'✓')+'</div>'+
      '<div class="type-toggle"><div class="type-btn '+(!isW?'sel-dep':'')+'" data-t="deposit">💰 Deposit</div><div class="type-btn '+(isW?'sel-wit':'')+'" data-t="withdrawal">🏧 Withdrawal</div></div>'+
      '<div class="amt-display"><span class="amt-curr">GH₵</span><span class="amt-val'+(isW?' wit':'')+'" id="show">'+(d.amount||0)+'</span></div>'+
      '<div class="amt-chips">'+chips.map(function(v){return '<span class="ac'+(d.amount===v?' sel':'')+'" data-a="'+v+'">'+money(v)+'</span>';}).join('')+'</div>'+
      '<div style="padding:14px 16px 0"><input class="inp" id="amt" type="number" inputmode="decimal" placeholder="Or type exact amount" value="'+(d.amount||'')+'"></div>'+
      '<div class="sec-lbl">Payment Method</div><div class="method-row">'+['Cash','MoMo','Bank Transfer'].map(function(m){var ic=m==='Cash'?'💵':m==='MoMo'?'📱':'🏦';return '<div class="meth-btn'+(d.method===m?' sel':'')+'" data-m="'+m+'"><span class="meth-ico">'+ic+'</span><span class="meth-lbl">'+m+'</span></div>';}).join('')+'</div>'+
      '<div style="padding:14px 16px"><input class="inp" id="note" placeholder="Add note (optional)" value="'+esc(d.note)+'"></div>'+
      '<div style="padding:0 16px 24px"><button class="btn btn-full btn-lg '+(isW?'':'btn-p')+'" id="next" style="'+(isW?'background:linear-gradient(135deg,#B91C1C,#DC2626);color:#fff;box-shadow:0 4px 18px rgba(220,38,38,.3)':'')+'">Next: Review →</button></div>');
    q('[data-back]').onclick=function(){custList(d.type);};
    all('[data-t]').forEach(function(el){el.onclick=function(){d.type=el.getAttribute('data-t');amountScreen();};});
    function upd(){q('#show').textContent=d.amount;all('.ac').forEach(function(el){el.classList.toggle('sel',Number(el.getAttribute('data-a'))===d.amount);});}
    all('.ac').forEach(function(el){el.onclick=function(){d.amount=Number(el.getAttribute('data-a'))||0;q('#amt').value=d.amount||'';upd();};});
    q('#amt').oninput=function(e){d.amount=Number(e.target.value)||0;upd();};
    all('.meth-btn').forEach(function(el){el.onclick=function(){d.method=el.getAttribute('data-m');all('.meth-btn').forEach(function(x){x.classList.remove('sel');});el.classList.add('sel');};});
    q('#note').oninput=function(e){d.note=e.target.value;};
    q('#next').onclick=function(){if(!d.amount||d.amount<=0){toast('Enter an amount','err');return;}reviewScreen();};}
  function feeFor(a){return Math.round(a*(S.ws.feePercent||0)/100*100)/100;}
  function reviewScreen(){S.screen='review';var d=S.draft,c=d.cust,isW=d.type==='withdrawal';var fee=isW?feeFor(d.amount):0;var nb=isW?(c.balance-(d.amount+fee)):(c.balance+d.amount);
    set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Confirm '+(isW?'Withdrawal':'Deposit')+'</div></div>'+
      '<div class="step-ind"><div class="b on"></div><div class="b on"></div><div style="font-size:11px;color:var(--t3);font-weight:700;margin-left:4px">2 of 2</div></div>'+
      '<div class="confirm-card"><div class="confirm-top'+(isW?' wit':'')+'"><div class="conf-type">'+(isW?'🏧 WITHDRAWAL':'💰 DEPOSIT')+'</div><div class="conf-amt">'+money(d.amount)+'</div><div class="conf-fee">'+(isW?('Fee '+money(fee)+' · '):'No fee · ')+esc(d.method)+'</div></div><div class="confirm-body">'+
      cr('Customer',esc(c.name))+cr('Account',esc(acctNo(c)))+cr('Method',esc(d.method))+(isW?cr('Fee ('+(S.ws.feePercent||0)+'%)',money(fee)):'')+cr('Current Balance','<span style="color:var(--t3)">'+money(c.balance)+'</span>')+cr('New Balance','<span style="color:'+(isW?'var(--wit)':'var(--dep)')+';font-weight:900">'+money(nb)+'</span>')+(d.note?cr('Note',esc(d.note)):'')+cr('Collector',esc(S.user.name))+'</div></div>'+
      (isW&&nb<(S.ws.minBalance||0)?'<div class="fee-box" style="background:var(--wit-bg);color:var(--wit-txt)">⚠️ New balance is below the minimum ('+money(S.ws.minBalance)+'). May be rejected.</div>':'')+
      '<div style="padding:0 16px 24px;display:flex;flex-direction:column;gap:10px"><button class="btn btn-p btn-full btn-lg" id="ok" style="'+(isW?'background:linear-gradient(135deg,#B91C1C,#DC2626)':'')+'">✓ Confirm & Record</button><button class="btn btn-ghost btn-full" id="edit">← Edit</button></div>');
    q('[data-back]').onclick=amountScreen;q('#edit').onclick=amountScreen;q('#ok').onclick=submitTxn;}
  function cr(k,v){return '<div class="conf-row"><span class="conf-key">'+k+'</span><span class="conf-val">'+v+'</span></div>';}
  function submitTxn(){var d=S.draft,c=d.cust,btn=q('#ok');btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
    api('/api/transactions',{method:'POST',body:JSON.stringify({customerId:c._id,amount:d.amount,type:d.type,method:d.method,notes:d.note,idempotencyKey:uuid()})}).then(function(r){if(r.queued){toast(r.message||'Saved offline — will sync','warn');collectorHome();return;}receiptScreen(r.data,c,d);}).catch(function(e){toast(e.message||'Failed','err');reviewScreen();});}
  function receiptScreen(tx,c,d){S.screen='receipt';var isW=d.type==='withdrawal';var fee=tx.feeAmount||0;var nb=isW?(c.balance-(tx.amount+fee)):(c.balance+tx.amount);
    var wa='Awinbire Receipt%0AType: '+(isW?'WITHDRAWAL':'DEPOSIT')+'%0ACustomer: '+encodeURIComponent(c.name)+'%0AAmount: '+encodeURIComponent(money(tx.amount))+'%0AMethod: '+encodeURIComponent(d.method)+'%0ARef: '+encodeURIComponent(tx.receiptNumber||'')+'%0A%0AThank you for saving with Awinbire';
    set('<div class="receipt-success'+(isW?' wit':'')+'"><div class="rcpt-check">✓</div><div class="rcpt-title">'+(isW?'Withdrawal Recorded!':'Deposit Recorded!')+'</div><div class="rcpt-sub">Saved to your database</div><div class="rcpt-amt">'+money(tx.amount)+'</div></div>'+
      '<div class="sc"><div class="receipt-paper"><div class="rcpt-stripe"></div><div class="rcpt-head"><div class="rcpt-logo-name">Awinbire Enterprise<br><span style="font-size:9px;color:var(--t3);font-weight:600">Savings Management</span></div><div class="rcpt-ref">Ref: <strong>'+esc(tx.receiptNumber||'—')+'</strong></div></div><div class="rcpt-body">'+
      rr('Type',(isW?'🏧 Withdrawal':'💰 Deposit'))+rr('Customer',esc(c.name))+rr('Account #','<span style="font-family:monospace;color:var(--g-600)">'+esc(acctNo(c))+'</span>')+rr('Amount','<span style="color:'+(isW?'var(--wit)':'var(--dep)')+'">'+money(tx.amount)+'</span>')+(isW?rr('Fee',money(fee)):'')+rr('Method',esc(d.method))+rr('New Balance','<span style="color:'+(isW?'var(--wit)':'var(--dep)')+';font-weight:900">'+money(nb)+'</span>')+rr('Status',esc(tx.status||'approved'))+rr('Collector',esc(S.user.name))+
      '</div><div style="padding:14px 20px;background:var(--surf2);text-align:center;font-size:10px;color:var(--t3)">Thank you for saving with Awinbire Enterprise 🌿</div></div>'+
      '<div class="rcpt-actions"><a class="btn btn-full" style="background:#25D366;color:#fff" href="https://wa.me/?text='+wa+'" target="_blank">📲 WhatsApp</a><button class="btn btn-ghost btn-full" id="pr">🖨 Print</button></div>'+
      '<div style="padding:0 16px 30px"><button class="btn btn-p btn-full" id="hm">← Back to Home</button></div></div>');
    q('#hm').onclick=collectorHome;q('#pr').onclick=function(){window.print();};}
  function rr(k,v){return '<div class="rcpt-row"><span class="rcpt-key">'+k+'</span><span class="rcpt-val">'+v+'</span></div>';}

  // ---------- ADMIN / MANAGER / ACCOUNTANT ----------
  function adminDash(){S.screen='dash';set('<div class="center-load"><div class="spin"></div>Loading dashboard…</div>');
    Promise.all([api('/api/dashboard').catch(function(){return{data:{}};}),api('/api/dashboard/timeseries?days=7').catch(function(){return{data:[]};}),api('/api/transactions?limit=6').catch(function(){return{data:[]};}),api('/api/transactions?status=pending&limit=100').catch(function(){return{data:[]};})]).then(function(r){

  function employeesScreen(){S.screen='employees';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Employees</div><div class="ab-back" id="addemp" style="width:auto;padding:0 12px;font-size:22px">＋</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    api('/api/employees').then(function(d){var list=d.data||[];S.emps=list;
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Employees ('+list.length+')</div><div class="ab-back" id="addemp" style="width:auto;padding:0 12px;font-size:22px">＋</div></div><div class="sc"><div class="body-pad">'+(list.length?list.map(empRow).join(''):'<div class="empty"><div class="ei">🧑‍💼</div>No employees.</div>')+'</div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;q('#addemp').onclick=addEmpModal;wireNav();}).catch(function(e){toast(e.message,'err');});}
  function empRow(e){return '<div class="cli"><div class="cli-av" style="background:'+(e.color||colorFor(e._id))+'">'+initials(e.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(e.name)+'</div><div class="cli-meta">'+esc(roleLabel(e.role))+' · '+esc(e.zone||'')+'</div></div><div class="cli-right"><div class="cli-bal" style="color:var(--g-600)">'+money(e.collections)+'</div><div class="cli-id">'+(e.performance||0)+'% perf</div></div></div>';}
  function addEmpModal(){modal('<h3>Add Employee</h3><div class="inp-wrap"><input class="inp" id="en" placeholder="Full name"></div><div class="inp-wrap"><input class="inp" id="ep" placeholder="Phone"></div><div class="inp-wrap"><input class="inp" id="ez" placeholder="Zone / Market"></div><div class="inp-wrap"><select class="inp" id="er">'+ROLES.map(function(r){return '<option value="'+r.key+'">'+r.name+'</option>';}).join('')+'</select></div><div class="inp-wrap"><input class="inp" id="eu" placeholder="Username (for login)"></div><div class="inp-wrap"><input class="inp" id="epw" type="password" placeholder="Password (min 6)"></div><button class="btn btn-p btn-full btn-lg" id="es">Create Employee</button><button class="btn btn-ghost btn-full" style="margin-top:8px" id="ec">Cancel</button>');
    q('#ec').onclick=closeModal;q('#es').onclick=function(){var name=q('#en').value.trim(),phone=q('#ep').value.trim(),zone=q('#ez').value.trim(),role=q('#er').value,u=q('#eu').value.trim(),pw=q('#epw').value;if(!name||!phone||!zone||!u||pw.length<6){toast('Fill all fields; password min 6 chars','err');return;}var b=q('#es');b.innerHTML='<span class="spin"></span>';b.disabled=true;
      api('/api/employees',{method:'POST',body:JSON.stringify({name:name,phone:phone,zone:zone,role:role,username:u,password:pw,privileges:defaultPrivs(role)})}).then(function(r){closeModal();toast('Employee created'+(r.credentials?(' — login: '+r.credentials.username):''),'ok');employeesScreen();}).catch(function(e){toast(e.message,'err');closeModal();});};}

  // ---------- ROLES & PRIVILEGES ----------
  function rolesScreen(){S.screen='roles';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Roles & Privileges</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    api('/api/employees').then(function(d){var list=d.data||[];
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Roles & Privileges</div></div><div class="sc"><div class="body-pad"><div style="font-size:12px;color:var(--t3);margin-bottom:12px">Tap an employee to change their role and toggle what they can access.</div>'+(list.length?list.map(function(e){return '<div class="cli" data-emp="'+esc(e._id)+'"><div class="cli-av" style="background:'+(e.color||colorFor(e._id))+'">'+initials(e.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(e.name)+'</div><div class="cli-meta">'+esc(roleLabel(e.role))+' · '+((e.privileges||[]).length)+' privileges</div></div><span class="set-val">›</span></div>';}).join(''):'<div class="empty"><div class="ei">🛡️</div>No employees.</div>')+'</div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;all('[data-emp]').forEach(function(el){el.onclick=function(){var e=list.filter(function(x){return x._id===el.getAttribute('data-emp');})[0];if(e)editRoles(e);};});wireNav();}).catch(function(e){toast(e.message,'err');});}
  function editRoles(emp){S.screen='editroles';var selRole=emp.role||'field_collector';var selPrivs=(emp.privileges||[]).slice();
    function draw(){var cats={};PRIVS.forEach(function(p){(cats[p.c]=cats[p.c]||[]).push(p);});
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Edit Access</div><div class="ab-back" id="save" style="width:auto;padding:0 12px;font-size:14px;font-weight:700">Save</div></div><div class="sc"><div class="body-pad">'+
        '<div class="cli" style="margin-bottom:14px"><div class="cli-av" style="background:'+(emp.color||colorFor(emp._id))+'">'+initials(emp.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(emp.name)+'</div><div class="cli-meta">'+esc(emp.zone||'')+'</div></div></div>'+
        '<div class="sec-lbl" style="padding-left:0">Assigned Role</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+ROLES.map(function(r){return '<span class="chip'+(selRole===r.key?' on':'')+'" data-role="'+r.key+'">'+r.name+'</span>';}).join('')+'</div>'+
        Object.keys(cats).map(function(cat){return '<div class="sec-lbl" style="padding-left:0">'+cat+'</div><div style="border-radius:var(--r14);overflow:hidden;box-shadow:var(--sh-xs);margin-bottom:12px">'+cats[cat].map(function(p){return '<div class="set-item"><div style="flex:1"><div class="set-lbl" style="font-size:13px">'+p.n+'</div></div><div class="tgl'+(selPrivs.indexOf(p.id)>=0?' on':'')+'" data-priv="'+p.id+'"><b></b></div></div>';}).join('')+'</div>';}).join('')+
        '<button class="btn btn-p btn-full btn-lg" id="save2">💾 Save Changes</button></div></div>'+bnav('more'));
      q('[data-back]').onclick=rolesScreen;
      all('[data-role]').forEach(function(el){el.onclick=function(){selRole=el.getAttribute('data-role');selPrivs=defaultPrivs(selRole).slice();draw();};});
      all('[data-priv]').forEach(function(el){el.onclick=function(){var id=el.getAttribute('data-priv');var i=selPrivs.indexOf(id);if(i>=0)selPrivs.splice(i,1);else selPrivs.push(id);el.classList.toggle('on');};});
      function doSave(){api('/api/employees/'+emp._id,{method:'PATCH',body:JSON.stringify({role:selRole,privileges:selPrivs})}).then(function(){toast('Access updated','ok');rolesScreen();}).catch(function(e){toast(e.message,'err');});}
      q('#save').onclick=doSave;q('#save2').onclick=doSave;}
    draw();}

  // ---------- ASSIGNMENTS ----------
  function assignmentsScreen(){S.screen='assignments';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Assignments</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    Promise.all([api('/api/customers'),api('/api/employees')]).then(function(r){var custs=r[0].data||[];var emps=r[1].data||[];S.asgCusts=custs;S.asgEmps=emps;
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Assignments</div></div><div class="sc"><div class="body-pad"><div style="font-size:12px;color:var(--t3);margin-bottom:10px">Tap a customer to assign them to a collector.</div><div class="search-bar">🔎<input id="q" placeholder="Search customer…"></div><div id="list">'+custs.map(asgRow).join('')+'</div></div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;var box=q('#q');box.oninput=function(){var v=box.value.toLowerCase();q('#list').innerHTML=custs.filter(function(c){return (c.name||'').toLowerCase().indexOf(v)>=0;}).map(asgRow).join('');wireAsg();};wireAsg();wireNav();}).catch(function(e){toast(e.message,'err');});}
  function asgRow(c){return '<div class="cli" data-asg="'+esc(c._id)+'"><div class="cli-av" style="background:'+colorFor(c._id)+'">'+initials(c.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(c.name)+'</div><div class="cli-meta">Collector: '+esc((c.assignedEmployee&&c.assignedEmployee.name)||'unassigned')+'</div></div><span class="set-val">Assign ›</span></div>';}
  function wireAsg(){all('[data-asg]').forEach(function(el){el.onclick=function(){var c=S.asgCusts.filter(function(x){return x._id===el.getAttribute('data-asg');})[0];if(c)assignModal(c);};});}
  function assignModal(c){modal('<h3>Assign '+esc(c.name)+'</h3><div style="font-size:12px;color:var(--t3);margin-bottom:12px">Choose a collector:</div><div style="max-height:50vh;overflow:auto">'+S.asgEmps.map(function(e){return '<div class="cli" data-pick="'+esc(e._id)+'"><div class="cli-av" style="background:'+(e.color||colorFor(e._id))+'">'+initials(e.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(e.name)+'</div><div class="cli-meta">'+esc(roleLabel(e.role))+' · '+esc(e.zone||'')+'</div></div></div>';}).join('')+'</div><button class="btn btn-ghost btn-full" style="margin-top:10px" id="ac">Cancel</button>');
    q('#ac').onclick=closeModal;all('[data-pick]').forEach(function(el){el.onclick=function(){var empId=el.getAttribute('data-pick');api('/api/customers/'+c._id+'/assign',{method:'PATCH',body:JSON.stringify({employeeId:empId})}).then(function(){closeModal();toast('Customer assigned','ok');assignmentsScreen();}).catch(function(e){toast(e.message,'err');closeModal();});};});}

  // ---------- REPORTS ----------
  function reportsScreen(){S.screen='reports';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Reports</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    api('/api/dashboard/reports').then(function(r){var rep=r.data||{};var bm=rep.byMethod||[];var top=rep.topEmployees||[];
      var totalDep=0,totalWit=0;(rep.byMonth||[]).forEach(function(m){if(m._id.type==='deposit')totalDep+=m.total;else if(m._id.type==='withdrawal')totalWit+=m.total;});
      var methodTotal=bm.reduce(function(s,m){return s+(m.amount||0);},0)||1;
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Reports</div></div><div class="sc"><div class="body-pad">'+
        '<div class="card"><div style="display:flex;gap:12px;text-align:center"><div style="flex:1"><div style="font-size:20px;font-weight:900;color:var(--dep)">'+money(totalDep)+'</div><div style="font-size:10px;color:var(--t3);font-weight:600">TOTAL DEPOSITS</div></div><div style="width:1px;background:var(--border-l)"></div><div style="flex:1"><div style="font-size:20px;font-weight:900;color:var(--wit)">'+money(totalWit)+'</div><div style="font-size:10px;color:var(--t3);font-weight:600">TOTAL WITHDRAWALS</div></div></div></div>'+
        '<div class="card"><div class="s-div" style="margin:0 0 10px"><span class="s-div-title">By Payment Method</span></div>'+(bm.length?bm.map(function(m){var pct=Math.round((m.amount||0)/methodTotal*100);return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>'+esc(m._id||'—')+'</span><span style="font-weight:700">'+money(m.amount)+' ('+pct+'%)</span></div><div class="prog-bg"><div class="prog-fill" style="width:'+pct+'%"></div></div></div>';}).join(''):'<div style="font-size:12px;color:var(--t3)">No data.</div>')+'</div>'+
        '<div class="s-div"><span class="s-div-title">Top Collectors</span></div>'+(top.length?top.map(function(e,i){return '<div class="cli"><div class="cli-av" style="background:'+(e.color||colorFor(e._id))+'">'+(i+1)+'</div><div class="cli-info"><div class="cli-name">'+esc(e.name)+'</div><div class="cli-meta">'+esc(e.zone||'')+'</div></div><div class="cli-bal" style="color:var(--g-600)">'+money(e.collections)+'</div></div>';}).join(''):'<div class="empty">No data.</div>')+
        '</div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;wireNav();}).catch(function(e){toast(e.message,'err');});}

  // ---------- LEADERBOARD ----------
  function leaderboardScreen(){S.screen='leaderboard';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Leaderboard 🏆</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    api('/api/employees').then(function(d){var list=(d.data||[]).slice().sort(function(a,b){return (b.collections||0)-(a.collections||0);});var max=(list[0]&&list[0].collections)||1;
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Leaderboard 🏆</div></div><div class="sc"><div class="body-pad">'+(list.length?list.map(function(e,i){var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':('#'+(i+1));return '<div class="cli"><div style="width:28px;text-align:center;font-weight:900;flex-shrink:0">'+medal+'</div><div class="cli-av" style="background:'+(e.color||colorFor(e._id))+'">'+initials(e.name)+'</div><div class="cli-info"><div class="cli-name">'+esc(e.name)+'</div><div class="cli-meta">'+esc(e.zone||'')+'</div><div class="prog-bg" style="margin-top:5px"><div class="prog-fill" style="width:'+Math.round((e.collections||0)/max*100)+'%"></div></div></div><div class="cli-bal" style="color:var(--g-600)">'+money(e.collections)+'</div></div>';}).join(''):'<div class="empty">No employees.</div>')+'</div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;wireNav();}).catch(function(e){toast(e.message,'err');});}

  // ---------- LOANS ----------
  function loansScreen(){S.screen='loans';set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Loans</div></div><div class="center-load"><div class="spin"></div>Loading…</div>');
    api('/api/loans').then(function(d){var list=d.data||[];
      set('<div class="app-bar"><div class="ab-back" data-back>←</div><div class="ab-title">Loans ('+list.length+')</div></div><div class="sc"><div class="body-pad">'+(list.length?list.map(function(l){var name=l.customerName||(l.customer&&l.customer.name)||'—';return '<div class="card" style="padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:800">'+esc(name)+'</div><div style="font-size:11px;color:var(--t3)">'+esc(l.purpose||'')+' · '+esc(l.status||'')+'</div></div><div style="text-align:right"><div style="font-weight:900;color:var(--wit)">'+money(l.outstanding)+'</div><div style="font-size:10px;color:var(--t3)">of '+money(l.amount)+'</div></div></div></div>';}).join(''):'<div class="empty"><div class="ei">💳</div>No loans.</div>')+'</div></div>'+bnav('more'));
      q('[data-back]').onclick=moreScreen;wireNav();}).catch(function(e){toast(e.message,'err');});}

  // ---------- NAV ----------
  function avatarNotif(){return '<div class="hdr-av" id="av">'+initials(S.user.name)+(S.unread?'<div class="notif-badge">'+(S.unread>9?'9+':S.unread)+'</div>':'')+'</div>';}
  function wireAvatar(){var a=q('#av');if(a)a.onclick=notifsScreen;}
  function bnav(active){var r=role();var items;
    if(r==='Field Collector')items=[['home','🏠','Home'],['customers','👥','Customers'],['notifs','🔔','Alerts'],['settings','⚙️','Settings']];
    else if(r==='Customer')items=[['home','🏠','Account'],['txns','🧾','History'],['notifs','🔔','Alerts'],['settings','⚙️','Settings']];
    else items=[['dash','📊','Dashboard'],['approvals','✅','Approvals'],['customers','👥','Customers'],['more','☰','More'],['settings','⚙️','Settings']];
    return '<div class="bnav">'+items.map(function(it){return '<div class="bnav-item'+(active===it[0]?' act':'')+'" data-nav="'+it[0]+'"><div class="bnav-icon">'+it[1]+'</div><div class="bnav-lbl">'+it[2]+'</div>'+(it[0]==='notifs'&&S.unread?'<div class="bnav-dot">'+(S.unread>9?'9+':S.unread)+'</div>':'')+'</div>';}).join('')+'</div>';}
  function wireNav(){all('[data-nav]').forEach(function(el){var n=el.getAttribute('data-nav');el.onclick=function(){nav(n);};});}
  function nav(n){var r=role();
    if(n==='home'||n==='dash')home();
    else if(n==='customers'){ if(r==='Field Collector')custList('deposit'); else adminCustomers(); }
    else if(n==='approvals')approvalsScreen();
    else if(n==='txns')txnsScreen();
    else if(n==='notifs')notifsScreen();
    else if(n==='settings')settingsScreen();
    else if(n==='more')moreScreen();
    else if(n==='employees')employeesScreen();
    else if(n==='roles')rolesScreen();
    else if(n==='assignments')assignmentsScreen();
    else if(n==='reports')reportsScreen();
    else if(n==='leaderboard')leaderboardScreen();
    else if(n==='loans')loansScreen();}
  function logout(){localStorage.removeItem('aw_token');S.token=null;S.user=null;document.documentElement.setAttribute('data-theme','light');renderLogin();}

  function q(s){return document.querySelector(s);}function all(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

  if(S.token){api('/api/auth/me').then(function(d){S.user=d.user;afterLogin();}).catch(function(){localStorage.removeItem('aw_token');S.token=null;renderLogin();});}else{renderLogin();}
})();
</script>
</body>
</html>
